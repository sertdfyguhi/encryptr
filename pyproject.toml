[project]
name = "encryptr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sertdfyguhi" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "dearpygui==2.3.1",
    "platformdirs==4.11.15",
    "pycryptodome==3.23.0",
    "pyobjc==12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
encryptr = "encryptr:main.main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
